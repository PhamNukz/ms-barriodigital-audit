server:
  port: 8083

spring:
  application:
    name: ms-barriodigital-audit
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USER:barriodigital_audit}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Un grupo por servicio: audit-svc recibe todos los mensajes, aparte de report-svc.
      group-id: audit-svc
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Envuelve al JsonDeserializer: un JSON ilegible ya no explota dentro del poll (bucle
      # infinito sobre el mismo offset); llega al error handler, que lo manda a la DLT.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Solo nuestros DTO; "*" dejaba instanciar cualquier clase.
        spring.json.trusted.packages: cl.duoc.barriodigital.audit.kafka
        spring.json.use.type.headers: false
        spring.json.value.default.type: cl.duoc.barriodigital.audit.kafka.TramiteEventIn
    listener:
      # 3 hilos = 1 por particion: el grupo reparte las 3 particiones de cada topico.
      concurrency: 3

barriodigital:
  kafka:
    # Los declara ms-barriodigital-kafkaadmin; las DLT son <topico>.DLT.
    topics:
      requests-events: requests.events
      audit-timeline: audit.timeline
  security:
    issuer-uri: ${AAD_ISSUER_URI:https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0}
    audiences:
      # tokens v2.0 traen aud = GUID; v1.0 traen aud = api://GUID. Aceptar ambos.
      - ${AAD_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
      - api://${AAD_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
    required-scope: ${AAD_REQUIRED_SCOPE:access_as_user}

management:
  endpoints:
    web:
      exposure:
        include: health
